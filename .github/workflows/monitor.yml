name: Monitor de Mercado

on:
  schedule:
    # Roda a cada 30 minutos, todos os dias. Horario em UTC (nao precisa
    # mexer aqui - o script converte para horario de Brasilia sozinho).
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # permite rodar manualmente pelo botao "Run workflow"

permissions:
  contents: write  # necessario para o robo salvar o proprio progresso

jobs:
  verificar-mercado:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar o monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_mercado.py

      - name: Salvar progresso (evitar mensagens repetidas)
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state/estado.json
          git diff --staged --quiet || git commit -m "Atualiza estado do monitor [skip ci]"
          git push
